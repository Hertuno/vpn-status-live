name: Monitor VPN nodes
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/monitor.yml"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TCP checks
        run: |
          python3 <<'PY'
          import json, socket
          from datetime import datetime, timezone

          monitors = [
            {"name": "vpn-a-443", "host": "176.32.37.203", "port": 443},
            {"name": "vpn-a-2053", "host": "176.32.37.203", "port": 2053},
            {"name": "vpn-b-443", "host": "132.243.208.212", "port": 443},
            {"name": "vpn-b-2053", "host": "132.243.208.212", "port": 2053},
          ]

          def up(host, port, timeout=5.0):
              try:
                  with socket.create_connection((host, port), timeout=timeout):
                      return True
              except OSError:
                  return False

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S")
          out = {"checked_at": now, "monitors": []}
          for m in monitors:
              ok = up(m["host"], m["port"])
              out["monitors"].append({"name": m["name"], "up": ok})
              print(f"{m['name']}={'UP' if ok else 'DOWN'}")

          text = json.dumps(out, ensure_ascii=False, indent=2) + "\n"
          open("status.json", "w", encoding="utf-8").write(text)
          open("down.txt", "w", encoding="utf-8").write(
              ",".join(m["name"] for m in out["monitors"] if not m["up"])
          )
          PY
      - name: Commit on main
        run: |
          git config user.name "vpn-status-bot"
          git config user.email "vpn-status-bot@users.noreply.github.com"
          git add status.json
          if git diff --staged --quiet; then
            echo "main: no status change"
          else
            git commit -m "chore: status $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - name: Publish to gh-pages
        run: |
          git config user.name "vpn-status-bot"
          git config user.email "vpn-status-bot@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages || git checkout --orphan gh-pages
          git checkout gh-pages
          # сохранить/обновить только публичные файлы
          git checkout main -- status.json index.html 2>/dev/null || true
          # если index с main другой — уже ок; status с main точно берём
          git checkout main -- status.json
          if [ ! -f index.html ]; then git checkout main -- index.html; fi
          git add status.json index.html
          if git diff --staged --quiet; then
            echo "gh-pages: no change"
          else
            git commit -m "chore: pages status $(date -u +%Y-%m-%dT%H:%MZ)"
            git push -u origin gh-pages
          fi
          git checkout main
      - name: Discord on DOWN
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          DOWN=$(cat down.txt || true)
          if [ -z "$DOWN" ]; then echo "All up"; exit 0; fi
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "No DISCORD_WEBHOOK_URL secret"; exit 0; fi
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"content\":\"**[VPN] DOWN:** ${DOWN}\\nВключите запасной ключ (второй сервер).\"}" \
            "$DISCORD_WEBHOOK_URL"
