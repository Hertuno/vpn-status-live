name: Monitor VPN nodes
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/monitor.yml"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TCP checks
        run: |
          python3 <<'PY'
          import json, socket
          from datetime import datetime, timezone

          monitors = [
            {"name": "vpn-a-443", "host": "176.32.37.203", "port": 443},
            {"name": "vpn-a-2053", "host": "176.32.37.203", "port": 2053},
            {"name": "vpn-b-443", "host": "132.243.208.212", "port": 443},
            {"name": "vpn-b-2053", "host": "132.243.208.212", "port": 2053},
          ]

          def up(host, port, timeout=5.0):
              try:
                  with socket.create_connection((host, port), timeout=timeout):
                      return True
              except OSError:
                  return False

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S")
          out = {"checked_at": now, "monitors": []}
          for m in monitors:
              ok = up(m["host"], m["port"])
              out["monitors"].append({"name": m["name"], "up": ok})
              print(f"{m['name']}={'UP' if ok else 'DOWN'}")

          open("status.json", "w", encoding="utf-8").write(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n"
          )
          down = [m["name"] for m in out["monitors"] if not m["up"]]
          open("down.txt", "w", encoding="utf-8").write(",".join(down))
          # предыдущее состояние для UP-уведомлений
          try:
              prev = json.load(open("prev-status.json", encoding="utf-8"))
              prev_down = {m["name"] for m in prev.get("monitors", []) if not m.get("up")}
          except Exception:
              prev_down = set(down)  # первый запуск — не спамить DOWN
          cur_down = set(down)
          open("notify-down.txt", "w").write(",".join(sorted(cur_down - prev_down)))
          open("notify-up.txt", "w").write(",".join(sorted(prev_down - cur_down)))
          open("prev-status.json", "w", encoding="utf-8").write(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n"
          )
          PY
      - name: Commit on main
        run: |
          git config user.name "vpn-status-bot"
          git config user.email "vpn-status-bot@users.noreply.github.com"
          git add status.json prev-status.json
          if git diff --staged --quiet; then
            echo "main: no status change"
          else
            git commit -m "chore: status $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - name: Publish to gh-pages
        run: |
          git config user.name "vpn-status-bot"
          git config user.email "vpn-status-bot@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages
          git checkout main -- status.json index.html
          git add status.json index.html
          if git diff --staged --quiet; then
            echo "gh-pages: no change"
          else
            git commit -m "chore: pages status $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin gh-pages
          fi
          git checkout main
      - name: Notify ntfy (no Telegram)
        continue-on-error: true
        env:
          # Публичный топик; клиенты подписываются по ссылке. Смени при желании.
          NTFY_TOPIC: vpn-hertuno-alert-7f3a9c2e
        run: |
          NEW_DOWN=$(cat notify-down.txt || true)
          NEW_UP=$(cat notify-up.txt || true)
          if [ -n "$NEW_DOWN" ]; then
            curl -fsS -H "Title: VPN недоступен" -H "Priority: high" -H "Tags: warning" \
              -d "Узлы: ${NEW_DOWN}. Включите запасной ключ. Статус: https://hertuno.github.io/vpn-status-live/" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          fi
          if [ -n "$NEW_UP" ]; then
            curl -fsS -H "Title: VPN восстановлен" -H "Tags: white_check_mark" \
              -d "Снова в работе: ${NEW_UP}. https://hertuno.github.io/vpn-status-live/" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          fi
      - name: Discord on DOWN
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          NEW_DOWN=$(cat notify-down.txt || true)
          if [ -z "$NEW_DOWN" ]; then echo "No new DOWN"; exit 0; fi
          if [ -z "$DISCORD_WEBHOOK_URL" ]; then echo "No Discord secret"; exit 0; fi
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"content\":\"**[VPN] DOWN:** ${NEW_DOWN}\\nЗапасной ключ + https://hertuno.github.io/vpn-status-live/\"}" \
            "$DISCORD_WEBHOOK_URL"
