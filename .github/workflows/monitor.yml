name: Monitor VPN nodes
# refresh-trigger: 2026-09-29T16:35Z
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/monitor.yml"
      - ".github/workflows/.monitor-bump"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: TCP checks
        run: |
          python3 <<'PY'
          import json, socket
          from datetime import datetime, timezone

          monitors = [
              {"name": "vpn-a-443", "host": "176.32.37.203", "port": 443},
              {"name": "vpn-a-2053", "host": "176.32.37.203", "port": 2053},
              {"name": "vpn-b-443", "host": "132.243.208.212", "port": 443},
              {"name": "vpn-b-2053", "host": "132.243.208.212", "port": 2053},
          ]

          def up(host, port, timeout=5.0):
              try:
                  with socket.create_connection((host, port), timeout=timeout):
                      return True
              except OSError:
                  return False

          now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S")
          out = {"checked_at": now, "monitors": []}
          for m in monitors:
              ok = up(m["host"], m["port"])
              out["monitors"].append({"name": m["name"], "up": ok})
              print(f"{m['name']}={'UP' if ok else 'DOWN'}")

          open("status.json", "w", encoding="utf-8").write(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n"
          )
          down = [m["name"] for m in out["monitors"] if not m["up"]]
          try:
              prev = json.load(open("prev-status.json", encoding="utf-8"))
              prev_down = {m["name"] for m in prev.get("monitors", []) if not m.get("up")}
          except Exception:
              prev_down = set(down)
          cur_down = set(down)
          open("notify-down.txt", "w").write(",".join(sorted(cur_down - prev_down)))
          open("notify-up.txt", "w").write(",".join(sorted(prev_down - cur_down)))
          open("prev-status.json", "w", encoding="utf-8").write(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n"
          )
          PY
      - name: Commit on main
        run: |
          git config user.name "vpn-status-bot"
          git config user.email "vpn-status-bot@users.noreply.github.com"
          git add status.json prev-status.json
          if git diff --staged --quiet; then
            echo "main: no status change"
          else
            git commit -m "chore: status $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
      - name: Publish to gh-pages
        run: |
          git config user.name "vpn-status-bot"
          git config user.email "vpn-status-bot@users.noreply.github.com"
          git fetch origin gh-pages:gh-pages
          git checkout gh-pages
          git checkout main -- status.json index.html family.html dns.html operator.html
          git add status.json index.html family.html dns.html operator.html
          if git diff --staged --quiet; then
            echo "gh-pages: no change"
          else
            git commit -m "chore: pages $(date -u +%Y-%m-%dT%H:%MZ)"
            git push origin gh-pages
          fi
          git checkout main
      - name: Notify ntfy (+ email via ntfy)
        continue-on-error: true
        env:
          NTFY_TOPIC: vpn-hertuno-alert-7f3a9c2e
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
        run: |
          NEW_DOWN=$(cat notify-down.txt || true)
          NEW_UP=$(cat notify-up.txt || true)
          AUTH=()
          if [ -n "$NTFY_TOKEN" ]; then AUTH=(-H "Authorization: Bearer ${NTFY_TOKEN}"); fi
          EMAIL_H=()
          if [ -n "$NTFY_EMAIL" ]; then EMAIL_H=(-H "Email: ${NTFY_EMAIL}"); fi
          if [ -n "$NEW_DOWN" ]; then
            curl -fsS -H "Title: VPN недоступен" -H "Priority: high" -H "Tags: warning" \
              "${AUTH[@]}" "${EMAIL_H[@]}" \
              -d "Узлы: ${NEW_DOWN}. Запасной ключ. https://hertuno.github.io/vpn-status-live/" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          fi
          if [ -n "$NEW_UP" ]; then
            curl -fsS -H "Title: VPN восстановлен" -H "Tags: white_check_mark" \
              "${AUTH[@]}" "${EMAIL_H[@]}" \
              -d "Снова в работе: ${NEW_UP}. https://hertuno.github.io/vpn-status-live/" \
              "https://ntfy.sh/${NTFY_TOPIC}"
          fi
      - name: Email on change (SMTP)
        continue-on-error: true
        env:
          SMTP_SERVER: ${{ secrets.SMTP_SERVER }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USERNAME: ${{ secrets.SMTP_USERNAME }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
          MAIL_FROM: ${{ secrets.MAIL_FROM }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
        run: |
          export NEW_DOWN=$(cat notify-down.txt || true)
          export NEW_UP=$(cat notify-up.txt || true)
          if [ -z "$NEW_DOWN" ] && [ -z "$NEW_UP" ]; then echo "No mail events"; exit 0; fi
          if [ -z "$SMTP_SERVER" ] || [ -z "$MAIL_TO" ] || [ -z "$MAIL_FROM" ]; then
            echo "SMTP secrets not set — skip mail"
            exit 0
          fi
          python3 - <<'PY'
          import os, smtplib, ssl
          from email.message import EmailMessage
          down = os.environ.get("NEW_DOWN", "")
          up = os.environ.get("NEW_UP", "")
          msg = EmailMessage()
          msg["Subject"] = "[VPN] " + (("недоступен: " + down) if down else ("восстановлен: " + up))
          msg["From"] = os.environ["MAIL_FROM"]
          msg["To"] = os.environ["MAIL_TO"]
          msg.set_content(
              f"DOWN: {down}\nUP: {up}\n"
              "Статус: https://hertuno.github.io/vpn-status-live/\n"
              "Запасной ключ — второй сервер.\n"
          )
          port = int(os.environ.get("SMTP_PORT") or "587")
          host = os.environ["SMTP_SERVER"]
          user = os.environ["SMTP_USERNAME"]
          password = os.environ["SMTP_PASSWORD"]
          ctx = ssl.create_default_context()
          if port == 465:
              with smtplib.SMTP_SSL(host, port, context=ctx, timeout=30) as s:
                  s.login(user, password)
                  s.send_message(msg)
          else:
              with smtplib.SMTP(host, port, timeout=30) as s:
                  s.starttls(context=ctx)
                  s.login(user, password)
                  s.send_message(msg)
          print("mail sent")
          PY
      - name: Discord
        continue-on-error: true
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: |
          NEW_DOWN=$(cat notify-down.txt || true)
          if [ -z "$NEW_DOWN" ] || [ -z "$DISCORD_WEBHOOK_URL" ]; then exit 0; fi
          curl -fsS -H 'Content-Type: application/json' \
            -d "{\"content\":\"**[VPN] DOWN:** ${NEW_DOWN}\\nhttps://hertuno.github.io/vpn-status-live/\"}" \
            "$DISCORD_WEBHOOK_URL"
