name: Test notify channels
# refresh: 2026-09-29T16:51Z
on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/test-notify.yml"
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: ntfy test
        env:
          NTFY_TOPIC: vpn-hertuno-alert-7f3a9c2e
          NTFY_TOKEN: ${{ secrets.NTFY_TOKEN }}
          NTFY_EMAIL: ${{ secrets.NTFY_EMAIL }}
        run: |
          HDR=(-H "Title: VPN: тексты для клиентов" -H "Tags: bell" -H "Click: https://hertuno.github.io/vpn-status-live/operator.html")
          if [ -n "$NTFY_TOKEN" ]; then HDR+=(-H "Authorization: Bearer ${NTFY_TOKEN}"); fi
          if [ -n "$NTFY_EMAIL" ]; then HDR+=(-H "Email: ${NTFY_EMAIL}"); fi
          curl -fsS "${HDR[@]}" \
            -d "Скопируй 3 текста: https://hertuno.github.io/vpn-status-live/operator.html" \
            "https://ntfy.sh/${NTFY_TOPIC}"
          echo "ntfy ok"
      - name: FormSubmit — тексты рассылки в письме
        continue-on-error: true
        env:
          FORMSUBMIT_EMAIL: ${{ secrets.FORMSUBMIT_EMAIL }}
        run: |
          export TO="${FORMSUBMIT_EMAIL:-hertuno@yandex.ru}"
          python3 <<'PY'
          import json, os, urllib.request
          to = os.environ["TO"]
          msg = """Перешли клиентам три сообщения (или https://hertuno.github.io/vpn-status-live/operator.html).

Если это первое письмо FormSubmit — нажми Activate, потом Actions → Test notify channels → Run ещё раз.

========== 1) DNS ==========
Можно включить фильтр рекламы через DNS — занимает пару минут.

Инструкция: https://hertuno.github.io/vpn-status-live/dns.html

В VPN укажите DNS:
94.140.14.14
94.140.15.15

Потом переподключитесь. Телевизор, телефон и компьютер начнут получать «чистый» DNS, пока включён VPN.

Если какой-то нужный сайт вдруг не откроется — напишите точный адрес.
Запасной ключ из подписки работает как раньше.

========== 2) Статус ==========
Если узел не отвечает, Telegram может тоже не открыться. Смотрите статус без VPN:
https://hertuno.github.io/vpn-status-live/

Пуши на телефон (не через Telegram):
https://ntfy.sh/vpn-hertuno-alert-7f3a9c2e
Откройте ссылку → Subscribe / Подписаться.

Запасной ключ из подписки — второй сервер.

========== 3) Семья ==========
Появился семейный тариф: один счёт на весь дом (до 8 устройств), два сервера, статус и оповещения при сбоях, фильтр рекламы.

Цена: ваш текущий годовой × 1.7 (выгоднее двух отдельных подписок).

Подробности: https://hertuno.github.io/vpn-status-live/family.html

Если дома уже несколько человек — напишите, переведём и выдадим ключи под устройства.
"""
          payload = {
            "name": "VPN operator",
            "_subject": "[VPN] три текста — перешли клиентам",
            "_template": "box",
            "_captcha": "false",
            "message": msg,
          }
          req = urllib.request.Request(
            f"https://formsubmit.co/ajax/{to}",
            data=json.dumps(payload).encode(),
            headers={"Content-Type": "application/json", "Accept": "application/json"},
            method="POST",
          )
          with urllib.request.urlopen(req, timeout=30) as r:
            print(r.read().decode())
          print("formsubmit ok ->", to)
          PY
