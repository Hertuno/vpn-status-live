name: Verify AdGuard DNS filter
on:
  workflow_dispatch:
  schedule:
    - cron: "0 */12 * * *"
  push:
    paths:
      - ".github/workflows/verify-dns.yml"
permissions:
  contents: write
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Probe AdGuard DNS (94.140.14.14)
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq dnsutils >/dev/null
          block_hosts=(doubleclick.net google-analytics.com pagead2.googlesyndication.com)
          ok_hosts=(google.com cloudflare.com)
          fail=0
          {
            echo "# DNS filter evidence"
            echo
            echo "Checked at: $(date -u +%Y-%m-%dT%H:%MZ) against \`94.140.14.14\`"
            echo
            echo "| Host | Role | Answer |"
            echo "|---|---|---|"
          } > dns-evidence.md
          for h in "${block_hosts[@]}"; do
            ans=$(dig +time=3 +tries=2 +short @94.140.14.14 "$h" A | tr '\n' ' ' || true)
            ans=${ans:-empty}
            echo "| \`$h\` | block | \`$ans\` |" >> dns-evidence.md
            if echo "$ans" | grep -Eq '([0-9]+\.){3}[0-9]+' && ! echo "$ans" | grep -Eq '(0\.0\.0\.0|127\.0\.0\.1)'; then
              echo "WARN non-sinkhole for $h" >&2
              fail=1
            fi
          done
          for h in "${ok_hosts[@]}"; do
            ans=$(dig +time=3 +tries=2 +short @94.140.14.14 "$h" A | head -1 || true)
            ans=${ans:-empty}
            echo "| \`$h\` | allow | \`$ans\` |" >> dns-evidence.md
            if ! echo "$ans" | grep -Eq '^([0-9]+\.){3}[0-9]+$' || echo "$ans" | grep -Eq '^(0\.0\.0\.0|127\.0\.0\.1)$'; then
              echo "FAIL allow for $h" >&2
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo >> dns-evidence.md
            echo "Result: **FAIL**" >> dns-evidence.md
            cat dns-evidence.md
            exit 1
          fi
          echo >> dns-evidence.md
          echo "Result: **OK** — публичный AdGuard DNS режет рекламные имена и пускает обычные." >> dns-evidence.md
          cat dns-evidence.md
      - name: Commit evidence
        run: |
          git config user.name "vpn-status-bot"
          git config user.email "vpn-status-bot@users.noreply.github.com"
          git add dns-evidence.md
          if git diff --staged --quiet; then
            echo "evidence unchanged"
          else
            git commit -m "chore: dns filter evidence $(date -u +%Y-%m-%dT%H:%MZ)"
            git push
          fi
