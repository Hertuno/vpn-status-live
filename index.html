<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta http-equiv="refresh" content="120"/>
<title>Статус VPN</title>
<style>
body{font-family:system-ui,sans-serif;max-width:640px;margin:2rem auto;padding:0 1rem;background:#f6f8fa;color:#1f2328}
h1{font-size:1.25rem}
.banner{padding:1rem;border-radius:8px;color:#fff;margin-bottom:1rem}
.ok{background:#1a7f37}.bad{background:#cf222e}
table{width:100%;border-collapse:collapse;background:#fff;border-radius:8px;overflow:hidden}
td,th{padding:.75rem;border-bottom:1px solid #d0d7de;text-align:left}
.meta{color:#656d76;font-size:.875rem;margin-top:1rem}
</style>
</head>
<body>
<h1>Статус VPN</h1>
<div id="banner" class="banner ok">Загрузка…</div>
<table>
<thead><tr><th>Узел</th><th>Состояние</th></tr></thead>
<tbody id="rows"></tbody>
</table>
<p class="meta" id="meta"></p>
<script>
async function load(){
  try{
    const r = await fetch('status.json?t=' + Date.now());
    const d = await r.json();
    const rows = document.getElementById('rows');
    rows.innerHTML = '';
    let allUp = true;
    for (const m of d.monitors){
      allUp = allUp && m.up;
      const tr = document.createElement('tr');
      tr.innerHTML = '<td>' + m.name + '</td><td style="font-weight:700;color:' + (m.up?'#1a7f37':'#cf222e') + '">' + (m.up?'OK':'DOWN') + '</td>';
      rows.appendChild(tr);
    }
    const b = document.getElementById('banner');
    b.textContent = allUp ? 'Все узлы в работе' : 'Есть проблемы — включите запасной ключ';
    b.className = 'banner ' + (allUp ? 'ok' : 'bad');
    document.getElementById('meta').textContent = 'Проверка: ' + d.checked_at + ' (UTC). Страница открывается без VPN.';
  }catch(e){
    document.getElementById('banner').textContent = 'Не удалось загрузить статус';
    document.getElementById('banner').className = 'banner bad';
  }
}
load();
</script>
</body>
</html>
